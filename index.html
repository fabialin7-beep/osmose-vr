<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Osmose 習作</title>
<style>
  :root { --fg: #dfe8ef; --dim: #8fa3b3; --accent: #7fe0cf; --bg: #000; }
  html, body { margin: 0; height: 100%; background: var(--bg); color: var(--fg);
    font-family: -apple-system, "PingFang TC", "Noto Sans TC", "Microsoft JhengHei", sans-serif; overflow: hidden; }
  canvas { display: block; }
  #panel { position: fixed; inset: 0; display: flex; align-items: center; justify-content: center;
    background: radial-gradient(ellipse at center, rgba(4,14,22,.55), rgba(0,0,0,.92)); padding: 16px; box-sizing: border-box; }
  .card { max-width: 560px; width: 100%; line-height: 1.7; }
  h1 { font-weight: 300; letter-spacing: .12em; margin: 0 0 4px; font-size: 30px; }
  .sub { color: var(--dim); margin: 0 0 24px; font-size: 14px; }
  p { margin: 0 0 14px; }
  ul { margin: 0 0 20px; padding-left: 1.2em; color: var(--fg); }
  li { margin-bottom: 6px; }
  button { font: inherit; font-size: 17px; padding: 12px 22px; border-radius: 999px; border: 1px solid var(--accent);
    background: rgba(127,224,207,.12); color: var(--fg); cursor: pointer; margin: 6px 8px 6px 0; }
  button.ghost { border-color: #456; background: transparent; color: var(--dim); font-size: 15px; }
  button:disabled { opacity: .4; cursor: default; }
  #meter { height: 10px; background: #122630; border-radius: 5px; overflow: hidden; margin: 10px 0 18px; }
  #meter > div { height: 100%; width: 0; background: var(--accent); transition: width .05s linear; }
  #calMsg { min-height: 1.6em; color: var(--dim); }
  .subtitle { min-height: 3.4em; font-size: 18px; margin: 0 0 18px; }
  button.big { font-size: 26px; padding: 18px 64px; }
  .note { color: var(--dim); font-size: 13px; }
  [hidden] { display: none !important; }
</style>
<script type="importmap">
{ "imports": { "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js" } }
</script>
</head>
<body>
<div id="panel"><div class="card">
  <h1>Osmose 習作</h1>
  <p class="sub">向 Char Davies《Osmose》（1995）致敬的呼吸式 VR · 約 5 分鐘</p>

  <p id="subtitle" class="subtitle"></p>

  <div id="stepWelcome">
    <button id="btnStart" class="big">開始</button>
    <p class="note">請開啟頭盔的聲音。按下開始後，會有語音一步一步帶你完成。</p>
  </div>

  <div id="stepIntro" hidden>
    <p id="pageNo" class="note"></p>
    <button id="btnSkip" class="ghost">跳過說明</button>
    <div id="introBtns" hidden>
      <button id="btnMic">允許麥克風</button>
      <button id="btnNoMic" class="ghost">不使用麥克風</button>
    </div>
  </div>

  <div id="stepCal" hidden>
    <p id="calMsg"></p>
    <div id="meter"><div></div></div>
    <button id="btnRetry" hidden>重新校準</button>
  </div>

  <div id="stepReady" hidden>
    <button id="btnVR" disabled>進入 VR</button>
    <button id="btnPreview" class="ghost" hidden>電腦預覽（除錯用）</button>
    <p id="xrMsg" class="note"></p>
  </div>

  <div id="stepEnd" hidden>
    <button onclick="location.reload()">再體驗一次</button>
  </div>
</div></div>

<script type="module" id="osmose-src">
import * as THREE from 'three';

// ---------- 基本設定 ----------
const DEBUG = new URLSearchParams(location.search).has('debug');
const TOTAL = 300;          // 總長最多約 5 分鐘
const TOP_EYE = 70;         // 結尾停留的高度（最上層的程式碼環中）
const START = new THREE.Vector3(0, 6, 24);   // 起點離中央的樹近一點
const EYE_MIN = -60, EYE_MAX = 72, WORLD_R = 50;
const TAU = Math.PI * 2;

let seed = 1995;
function rnd() { // 固定種子：每次世界長得一樣
  seed = (seed + 0x6D2B79F5) | 0; let t = Math.imul(seed ^ (seed >>> 15), 1 | seed);
  t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t; return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
}
const rand = (a, b) => a + (b - a) * rnd();
const hsl = (h, s, l) => new THREE.Color().setHSL(h, s, l);
const smooth = (a, b, x) => { const t = Math.min(1, Math.max(0, (x - a) / (b - a))); return t * t * (3 - 2 * t); };
const V = (x, y, z) => new THREE.Vector3(x, y, z);
const randInSphere = (r) => { let v; do { v = V(rand(-1, 1), rand(-1, 1), rand(-1, 1)); } while (v.lengthSq() > 1); return v.multiplyScalar(r); };
const ringPoint = (r0, r1) => { const a = rand(0, TAU), r = Math.sqrt(rand((r0 / r1) ** 2, 1)) * r1; return [Math.cos(a) * r, Math.sin(a) * r]; };

// ---------- 場景 ----------
const renderer = new THREE.WebGLRenderer({ antialias: false });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.setSize(innerWidth, innerHeight);
renderer.xr.enabled = true;
renderer.xr.setReferenceSpaceType('local-floor');
renderer.xr.setFoveation(1);
document.body.prepend(renderer.domElement);

const scene = new THREE.Scene();
scene.background = new THREE.Color(0x000000);
scene.fog = new THREE.Fog(0x000000, 3, 40);
const camera = new THREE.PerspectiveCamera(75, innerWidth / innerHeight, 0.05, 400);
camera.position.set(0, 1.6, 0);
camera.rotation.order = 'YXZ';
const rig = new THREE.Group();
rig.position.copy(START);
rig.add(camera);
scene.add(rig);

addEventListener('resize', () => {
  if (renderer.xr.isPresenting) return;
  camera.aspect = innerWidth / innerHeight; camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight); updatePixelScale();
});

const U = { uTime: { value: 0 }, uPixel: { value: 600 } };
function updatePixelScale() {
  U.uPixel.value = renderer.xr.isPresenting ? 820
    : innerHeight / (2 * Math.tan(THREE.MathUtils.degToRad(camera.fov / 2)));
}
updatePixelScale();

// =====================================================================
//  材質一：柔焦光點（霧、浮游生物、露珠、昆蟲群）
// =====================================================================
const PVS = `
uniform float uTime, uPixel, uFar, uDrift, uMaxSize, uBox, uYMin, uYMax;
attribute float aSize; attribute float aPhase; attribute vec3 aColor;
#ifdef SWARM
attribute vec3 aBase; attribute float aSwarm;
#endif
varying vec3 vColor; varying float vAlpha;
void main() {
  vec3 p = position + uDrift * vec3(sin(uTime*0.31 + aPhase*7.0), sin(uTime*0.23 + aPhase*5.0), cos(uTime*0.27 + aPhase*3.0));
  float band = 1.0, flick = 1.0;
#ifdef WRAP
  p = cameraPosition + mod(p - cameraPosition + 0.5 * uBox, uBox) - 0.5 * uBox;
  band = smoothstep(uYMin, uYMin + 4.0, p.y) * (1.0 - smoothstep(uYMax - 4.0, uYMax, p.y));
#endif
#ifdef SWARM
  // 昆蟲群：整群沿著緩慢的曲線漂移，每隻蟲繞著群中心快速飛舞、翅膀閃爍
  vec3 c = aBase + vec3(sin(uTime*0.13 + aSwarm)*2.5, sin(uTime*0.21 + aSwarm*2.0)*1.0, cos(uTime*0.11 + aSwarm)*2.5);
  float s1 = 0.7 + aPhase * 1.4;
  p = c + vec3(position.x * sin(uTime*s1 + aPhase*40.0), position.y * sin(uTime*s1*1.3 + aPhase*17.0), position.z * cos(uTime*s1 + aPhase*40.0))
        + 0.07 * vec3(sin(uTime*23.0 + aPhase*90.0), sin(uTime*29.0 + aPhase*70.0), cos(uTime*19.0 + aPhase*50.0));
  flick = 0.45 + 0.55 * abs(sin(uTime*14.0 + aPhase*100.0));
#endif
  vec4 mv = modelViewMatrix * vec4(p, 1.0);
  float d = max(-mv.z, 0.05);
  gl_Position = projectionMatrix * mv;
  gl_PointSize = clamp(2.4 * aSize * uPixel / d, 1.5, uMaxSize);
  float tw = 0.7 + 0.3 * sin(uTime*1.3 + aPhase*20.0);
  vAlpha = flick * band * tw * smoothstep(0.6, 2.2, d) * (1.0 - smoothstep(uFar*0.35, uFar, d));
  vColor = aColor * 2.2;
}`;
const PFS = `
uniform float uOpacity; varying vec3 vColor; varying float vAlpha;
void main() {
  vec2 q = gl_PointCoord - 0.5; float r = length(q);
#ifdef DROP
  // 露珠／光斑：亮邊加上一點高光
  float a = (1.0 - smoothstep(0.40, 0.5, r)) * (0.22 + 0.78 * smoothstep(0.18, 0.46, r));
  a += 0.7 * (1.0 - smoothstep(0.0, 0.11, length(q - vec2(-0.13, -0.14))));
#else
  float a = 1.0 - smoothstep(0.0, 0.5, r); a = a * (0.4 + 0.6 * a);
#endif
  if (a < 0.01) discard;
  gl_FragColor = vec4(vColor, a * vAlpha * uOpacity);
}`;
function pointMat({ opacity = 1, far = 42, drift = 0.04, maxSize = 48, wrap = null, swarm = false, drop = false } = {}) {
  const defines = {}; if (wrap) defines.WRAP = ''; if (swarm) defines.SWARM = ''; if (drop) defines.DROP = '';
  return new THREE.ShaderMaterial({
    defines,
    uniforms: { uTime: U.uTime, uPixel: U.uPixel, uOpacity: { value: opacity }, uFar: { value: wrap ? wrap.box / 2 : far },
      uDrift: { value: drift }, uMaxSize: { value: maxSize },
      uBox: { value: wrap ? wrap.box : 1 }, uYMin: { value: wrap ? wrap.y0 : 0 }, uYMax: { value: wrap ? wrap.y1 : 0 } },
    vertexShader: PVS, fragmentShader: PFS,
    transparent: true, depthWrite: false, blending: THREE.AdditiveBlending,
  });
}
class Pts {
  constructor() { this.p = []; this.c = []; this.s = []; this.ph = []; this.base = []; this.sw = []; }
  add(x, y, z, col, size) { this.p.push(x, y, z); this.c.push(col.r, col.g, col.b); this.s.push(size); this.ph.push(rnd()); return this; }
  build(mat) {
    const g = new THREE.BufferGeometry();
    g.setAttribute('position', new THREE.Float32BufferAttribute(this.p, 3));
    g.setAttribute('aColor', new THREE.Float32BufferAttribute(this.c, 3));
    g.setAttribute('aSize', new THREE.Float32BufferAttribute(this.s, 1));
    g.setAttribute('aPhase', new THREE.Float32BufferAttribute(this.ph, 1));
    if (this.base.length) {
      g.setAttribute('aBase', new THREE.Float32BufferAttribute(this.base, 3));
      g.setAttribute('aSwarm', new THREE.Float32BufferAttribute(this.sw, 1));
    }
    const m = new THREE.Points(g, mat); m.frustumCulled = false; scene.add(m); return m;
  }
}

// =====================================================================
//  材質二：半透明水晶（菲涅耳邊緣發光＋珍珠般的虹彩）
//  正面看幾乎透明，邊緣發亮；可以直接穿過去
// =====================================================================
const CVS = `
uniform float uTime;
attribute float aH;
varying vec3 vN; varying vec3 vW; varying float vD; varying float vH;
void main() {
  vec3 pos = position;
  vec4 w; vec3 n;
#ifdef USE_INSTANCING
  float ph = instanceMatrix[3].x * 0.37 + instanceMatrix[3].z * 0.23;
  #ifdef PULSE
  float k = sin(uTime * 1.6 + ph * 5.0);
  pos.xz *= 1.0 + 0.16 * k; pos.y *= 1.0 - 0.12 * k;
  #endif
  w = modelMatrix * instanceMatrix * vec4(pos, 1.0);
  n = mat3(modelMatrix) * mat3(instanceMatrix) * normal;
  #ifdef SWAY
  w.xz += vec2(sin(uTime * 0.7 + ph), cos(uTime * 0.6 + ph * 1.3)) * 0.07 * max(pos.y, 0.0);
  #endif
  #ifdef PULSE
  w.y += sin(uTime * 0.3 + ph) * 0.6;
  #endif
#else
  w = modelMatrix * vec4(pos, 1.0);
  n = mat3(modelMatrix) * normal;
#endif
  vN = n; vW = w.xyz; vH = aH;
  vec4 mv = viewMatrix * w; vD = -mv.z;
  gl_Position = projectionMatrix * mv;
}`;
const CFS = `
uniform float uTime, uOpacity, uFar, uIri, uBase, uShimmer;
uniform vec3 uColA, uColB;
varying vec3 vN; varying vec3 vW; varying float vD; varying float vH;
void main() {
  vec3 v = normalize(cameraPosition - vW);
  float f = 1.0 - abs(dot(normalize(vN), v));
  f = pow(f, 1.5);
  vec3 iri = 0.5 + 0.5 * cos(6.2831 * (vec3(0.0, 0.33, 0.67) + f * 1.3 + vW.y * 0.04 + uTime * 0.02));
  vec3 col = mix(uColA, uColB, f) + uIri * iri * f;
  float sh = 1.0 - uShimmer + uShimmer * (0.5 + 0.5 * sin(vW.y * 3.0 - uTime * 1.2 + vW.x * 1.7 + vW.z * 1.3));
  float a = (uBase + (1.0 - uBase) * f) * sh * uOpacity;
  a *= smoothstep(0.4, 1.6, vD) * (1.0 - smoothstep(uFar * 0.4, uFar, vD));
  gl_FragColor = vec4(col, a);
}`;
function crystalMat({ a = [0.2, 0.1, 0.08], b = [1, 0.7, 0.55], opacity = 1, far = 60, iri = 0.4, base = 0.05, shimmer = 0.4, sway = false, pulse = false } = {}) {
  const defines = {}; if (sway) defines.SWAY = ''; if (pulse) defines.PULSE = '';
  return new THREE.ShaderMaterial({
    defines,
    uniforms: { uTime: U.uTime, uOpacity: { value: opacity }, uFar: { value: far }, uIri: { value: iri }, uBase: { value: base },
      uShimmer: { value: shimmer }, uColA: { value: new THREE.Color(...a) }, uColB: { value: new THREE.Color(...b) } },
    vertexShader: CVS, fragmentShader: CFS,
    transparent: true, depthWrite: false, side: THREE.DoubleSide, blending: THREE.AdditiveBlending,
  });
}

// 管狀枝幹（自己組成一個大網格，效能較好）
class Tubes {
  constructor() { this.pos = []; this.nor = []; this.h = []; }
  seg(a, b, ra, rb, sides, h0, h1) {
    const d = V(0, 0, 0).subVectors(b, a).normalize();
    const u = V(0, 0, 0).crossVectors(d, Math.abs(d.y) < 0.95 ? V(0, 1, 0) : V(1, 0, 0)).normalize();
    const w = V(0, 0, 0).crossVectors(d, u);
    for (let i = 0; i < sides; i++) {
      const t0 = (i / sides) * TAU, t1 = ((i + 1) / sides) * TAU;
      const n0 = u.clone().multiplyScalar(Math.cos(t0)).addScaledVector(w, Math.sin(t0));
      const n1 = u.clone().multiplyScalar(Math.cos(t1)).addScaledVector(w, Math.sin(t1));
      const p00 = a.clone().addScaledVector(n0, ra), p01 = a.clone().addScaledVector(n1, ra);
      const p10 = b.clone().addScaledVector(n0, rb), p11 = b.clone().addScaledVector(n1, rb);
      for (const [p, n, h] of [[p00, n0, h0], [p10, n0, h1], [p11, n1, h1], [p00, n0, h0], [p11, n1, h1], [p01, n1, h0]]) {
        this.pos.push(p.x, p.y, p.z); this.nor.push(n.x, n.y, n.z); this.h.push(h);
      }
    }
  }
  build(mat) {
    const g = new THREE.BufferGeometry();
    g.setAttribute('position', new THREE.Float32BufferAttribute(this.pos, 3));
    g.setAttribute('normal', new THREE.Float32BufferAttribute(this.nor, 3));
    g.setAttribute('aH', new THREE.Float32BufferAttribute(this.h, 1));
    const m = new THREE.Mesh(g, mat); m.frustumCulled = false; scene.add(m); return m;
  }
}
function lineSet(pairs, color, opacity, fog = true) {
  const arr = []; pairs.forEach(([a, b]) => arr.push(a.x, a.y, a.z, b.x, b.y, b.z));
  const g = new THREE.BufferGeometry(); g.setAttribute('position', new THREE.Float32BufferAttribute(arr, 3));
  const m = new THREE.LineSegments(g, new THREE.LineBasicMaterial({ color, transparent: true, opacity, depthWrite: false, blending: THREE.AdditiveBlending, fog }));
  m.frustumCulled = false; scene.add(m); return m;
}

// 彎曲、分岔的枝幹生成器（樹與根共用）
function grow(tubes, lines, nodes, from, dir, len, rad, depth, o) {
  let p = from.clone(); const d = dir.clone();
  for (let s = 0; s < 3; s++) {
    d.add(randInSphere(o.wiggle)); d.y += o.up; d.normalize();
    const q = p.clone().addScaledVector(d, len / 3);
    tubes.seg(p, q, rad * (1 - s * 0.12), rad * (1 - (s + 1) * 0.12), o.sides, depth / o.maxDepth, (depth + 0.3) / o.maxDepth);
    if (lines) lines.push([p, q]);
    p = q;
  }
  if (nodes) nodes.push(p.clone());
  if (depth >= o.maxDepth) {
    if (lines) for (let k = 0; k < o.twigs; k++) {   // 末梢的細絲
      const q = p.clone().addScaledVector(d.clone().add(randInSphere(1.0)).normalize(), len * rand(0.4, 0.9));
      lines.push([p, q]);
    }
    return;
  }
  const kids = rnd() < 0.35 ? 3 : 2;
  for (let k = 0; k < kids; k++) {
    const nd = d.clone().add(randInSphere(o.spread)); nd.y += o.bias; nd.normalize();
    grow(tubes, lines, nodes, p, nd, len * rand(0.66, 0.84), rad * rand(0.55, 0.72), depth + 1, o);
  }
}

// =====================================================================
//  中心：水晶般的枯樹，樹根在半透明地面下鏡像延伸
// =====================================================================
const crystal = new Tubes(), crystalLines = [], rootNodes = [];
grow(crystal, crystalLines, null, V(0, 0, 0), V(0, 1, 0), 12, 2.1, 0,
  { wiggle: 0.14, up: 0.1, spread: 0.85, bias: 0.22, sides: 10, maxDepth: 7, twigs: 4 });
grow(crystal, crystalLines, rootNodes, V(0, 0, 0), V(0, -1, 0), 9, 1.7, 0,
  { wiggle: 0.42, up: -0.06, spread: 1.1, bias: -0.24, sides: 8, maxDepth: 7, twigs: 4 });
crystal.build(crystalMat({ a: [0.12, 0.06, 0.06], b: [1.0, 0.72, 0.6], iri: 0.6, base: 0.07, shimmer: 0.5, far: 170 }));  // 從任何一層都看得到
lineSet(crystalLines, 0xffd2bc, 0.55, false);   // 樹的「核心」與細絲

// 根的節點：遠看像星系，靠近像微生物
const galaxy = new Pts();
rootNodes.forEach((n) => {
  const cnt = 10;
  for (let i = 0; i < cnt; i++) {
    const v = randInSphere(1); v.y *= 0.35; const r = rand(0.1, 0.9);
    galaxy.add(n.x + v.x * r, n.y + v.y * r, n.z + v.z * r, hsl(rand(0.05, 0.12), 0.8, rand(0.45, 0.7)), rand(0.025, 0.05));
  }
});
galaxy.build(pointMat({ opacity: 0.9, far: 50, drift: 0.03 }));

// 林間空地的半透明地面：從上下兩側都看得見，可以沉穿過去
const clearingMat = new THREE.ShaderMaterial({
  uniforms: { uTime: U.uTime },
  vertexShader: `varying vec2 vP; void main(){ vP = position.xy; gl_Position = projectionMatrix * modelViewMatrix * vec4(position,1.0); }`,
  fragmentShader: `uniform float uTime; varying vec2 vP;
    void main(){ float r = length(vP);
      float n = 0.75 + 0.25 * sin(r * 1.3 - uTime * 0.4);   // 由中心向外緩慢擴散的柔和漣漪
      float a = (1.0 - smoothstep(4.0, 16.0, r)) * 0.22 * n;
      gl_FragColor = vec4(vec3(1.0, 0.62, 0.48) * (0.6 + 0.4*n), a); }`,
  transparent: true, depthWrite: false, side: THREE.DoubleSide, blending: THREE.AdditiveBlending,
});
const clearing = new THREE.Mesh(new THREE.CircleGeometry(16, 48), clearingMat);
clearing.rotation.x = -Math.PI / 2; clearing.position.y = 0.02; scene.add(clearing);

// 地面附近漂浮的粉白光球
const orbs = new Pts();
for (let i = 0; i < 140; i++) {
  const [x, z] = ringPoint(1.5, 16);
  orbs.add(x, rand(-1.5, 2.5), z, rnd() < 0.5 ? hsl(0.97, 0.6, 0.72) : hsl(0.08, 0.4, 0.8), rand(0.18, 0.5));
}
orbs.build(pointMat({ opacity: 0.55, drift: 0.35, maxSize: 110, drop: true, far: 50 }));

// =====================================================================
//  繁密黑暗的森林：半透明的暗色樹影、蕨類底層、落葉、苔光
// =====================================================================
const POND = V(0, 0, 0);   // 池塘在世界的中心軸上，環繞著水晶樹
const forestT = new Tubes();
for (let i = 0; i < 46; i++) {
  const [x, z] = ringPoint(14, 49);
  if (Math.hypot(x - POND.x, z - POND.z) < 8) continue;
  grow(forestT, null, null, V(x, -0.5, z), V(rand(-.08, .08), 1, rand(-.08, .08)).normalize(), rand(4, 7), rand(0.25, 0.45), 0,
    { wiggle: 0.3, up: 0.05, spread: 0.8, bias: 0.25, sides: 5, maxDepth: 4, twigs: 0 });
}
forestT.build(crystalMat({ a: [0.03, 0.01, 0.01], b: [0.55, 0.24, 0.18], iri: 0.08, base: 0.03, shimmer: 0.2, far: 42 }));

// 蕨類：一叢由幾片彎曲的葉片組成，隨風輕擺
function fernGeometry() {
  const pos = [], nor = [], h = [];
  const fronds = 9, segs = 10;
  for (let f = 0; f < fronds; f++) {
    const ang = (f / fronds) * TAU + rand(-0.3, 0.3), dir = V(Math.cos(ang), 0, Math.sin(ang));
    const side = V(-dir.z, 0, dir.x), L = rand(0.8, 1.3);
    const pts = [];
    for (let s = 0; s <= segs; s++) {
      const t = s / segs;
      const c = dir.clone().multiplyScalar(t * L * 0.9).add(V(0, Math.sin(t * Math.PI * 0.8) * L * 0.6, 0));

function textTexture(lines, { w = 1024, h = 1024, font = '26px Menlo, monospace', color = 'rgba(130,255,210,0.9)', lh = 34, center = false } = {}) {
  const c = document.createElement('canvas'); c.width = w; c.height = h;

  g.textAlign = center ? 'center' : 'left';
  lines.forEach((l, i) => g.fillText(l, center ? w / 2 : 20, (center ? (h - lh * lines.length) / 2 : 20) + i * lh));
  const t = new THREE.CanvasTexture(c); t.colorSpace = THREE.SRGBColorSpace; return t;
}
// 程式碼層：用這個作品自己的原始碼，揭露幻覺的來源
const src = document.getElementById('osmose-src').textContent.split('\n').map(s => s.replace(/\t/g, '  ')).filter(s => s.trim());
// 程式碼的材質：字本身很暗，只當成紋理；一道道亮光沿著每一行掃過去，另有一條緩慢的掃描帶上下移動
function codeMat(tex, seedN) {
  return new THREE.ShaderMaterial({
    uniforms: { map: { value: tex }, uTime: U.uTime, uSeed: { value: seedN } },
    vertexShader: `varying vec2 vUv; varying float vD;
      void main(){ vUv = uv; vec4 mv = modelViewMatrix * vec4(position, 1.0); vD = -mv.z; gl_Position = projectionMatrix * mv; }`,
    fragmentShader: `uniform sampler2D map; uniform float uTime, uSeed; varying vec2 vUv; varying float vD;
      float h(float n){ return fract(sin(n * 127.1 + uSeed * 31.7) * 43758.5453); }
      void main(){
        float g = texture2D(map, vUv).a; if (g < 0.03) discard;
        float row = floor(((1.0 - vUv.y) * 1024.0 - 20.0) / 34.0);
        float sp = 0.025 + 0.06 * h(row), pos = fract(uTime * sp + h(row + 7.0)) * 1.4 - 0.2;
        float streak = exp(-pow((vUv.x - pos) * 7.0, 2.0)) * step(0.3, h(row + 3.0));
        float trail = smoothstep(pos - 0.35, pos, vUv.x) * step(vUv.x, pos) * 0.35 * step(0.3, h(row + 3.0));
        float scan = exp(-pow((fract(vUv.y - uTime * 0.025) - 0.5) * 9.0, 2.0));
        float flick = 0.8 + 0.2 * sin(uTime * 1.5 + row * 1.7 + uSeed);
        vec3 col = vec3(0.15, 1.0, 0.55) * (0.22 * flick + 0.45 * scan + trail) + vec3(0.85, 1.0, 0.92) * streak * 1.5;
        float a = g * (0.22 + streak + trail + 0.35 * scan) * (1.0 - smoothstep(32.0, 48.0, vD));
        gl_FragColor = vec4(col, min(a, 1.0));
      }`,
    transparent: true, depthWrite: false, side: THREE.DoubleSide, blending: THREE.AdditiveBlending,
  });
}
const codeRings = [];
function codeRing(y, radius, size, count, offset) {
  const grp = new THREE.Group(); scene.add(grp); codeRings.push(grp);
  for (let k = 0; k < count; k++) {
    const start = ((k + offset) * 28) % Math.max(1, src.length - 28);
    const tex = textTexture(src.slice(start, start + 28).map(s => s.slice(0, 64)));
    const m = new THREE.Mesh(new THREE.PlaneGeometry(size, size), codeMat(tex, k + offset * 13));
    const a = (k / count) * TAU;

  audioTick -= dt;
  const wf = zoneWeight('forest', eye.y);
  if (audioTick <= 0) {
    audioTick = 0.25;
    for (const k in layers) { const w = zoneWeight(k, eye.y) * (endingMuted ? 0.35 : 1); layers[k].forEach(g => g.gain.setTargetAtTime(w, t, 0.8)); }
    forestBus.gain.setTargetAtTime(Math.max(wf, 0.15 * zoneWeight('leaf', eye.y)), t, 0.8);
  }
  if (wf > 0.05) {
    for (const c of sources.crickets) {     // 蟋蟀：一串短促的唧唧聲
      if (t < c.next) continue;
      const n = c.trill ? 12 : 3 + Math.floor(Math.random() * 2), on = 0.03, off = c.trill ? 0.02 : 0.035;
      for (let i = 0; i < n; i++) {
        const s = t + 0.05 + i * (on + off);
        c.g.gain.setValueAtTime(0, s); c.g.gain.linearRampToValueAtTime(c.amp, s + 0.005);
        c.g.gain.setValueAtTime(c.amp, s + on - 0.005); c.g.gain.linearRampToValueAtTime(0, s + on);
      }
      c.next = t + n * (on + off) + rand(0.4, 1.6);
    }
    for (const f of sources.frogs) {         // 青蛙：低沉的咕嚕聲
      if (t < f.next) continue;
      const n = 6 + Math.floor(Math.random() * 5);
      for (let i = 0; i < n; i++) {
        const s = t + 0.05 + i * 0.055;
        f.g.gain.setValueAtTime(0, s); f.g.gain.linearRampToValueAtTime(0.35, s + 0.01); f.g.gain.linearRampToValueAtTime(0, s + 0.045);
      }
      f.next = t + rand(2.5, 7);
    }
  }
  sources.swarms.forEach((p, i) => { swarmCenter(i, now, tmpV); setPos(p, tmpV.x, tmpV.y, tmpV.z); });
  const dTree = Math.hypot(eye.x, eye.z);
  if (dTree < 22 && eye.y > -12 && eye.y < 22 && Math.random() < dt * 0.4)
    bell(PENTA[Math.floor(Math.random() * PENTA.length)] * (Math.random() < 0.5 ? 0.5 : 1), 0.12, sources.tree);
  const we = zoneWeight('earth', eye.y), wo = zoneWeight('ocean', eye.y), wl = zoneWeight('leaf', eye.y);
  if (we > 0.3 && Math.random() < dt * 0.35) burst(rand(150, 260), 7, rand(0.3, 0.8), 0.25 * we);
  if (we > 0.3 && Math.random() < dt * 0.5) blip(rand(700, 900), 420, 0.25, 0.05 * we);
  if (wo > 0.3 && Math.random() < dt * 0.12) moan(0.12 * wo);
  if (wo > 0.3 && Math.random() < dt * 0.8) { const f = 160 + Math.random() * 120; blip(f, f * 2.4, 0.4, 0.05 * wo); }
  if (wl > 0.3 && Math.random() < dt * 0.6) bell(rand(500, 800), 0.05 * wl, bus);
}

// ---------- 麥克風：只偵測吐氣的氣流聲（1–3.5 kHz） ----------
const breath = { floor: -90, peak: -60, level: 0 };
function micDb() {
  if (!analyser) return -120;
  analyser.getFloatFrequencyData(freqBuf);
  const hz = actx.sampleRate / analyser.fftSize, a = Math.floor(1000 / hz), b = Math.floor(3500 / hz);
  let s = 0; for (let i = a; i <= b; i++) s += Math.pow(10, freqBuf[i] / 10);
  return 10 * Math.log10(s / (b - a + 1) + 1e-20);
}
async function initMic() {
  const stream = await navigator.mediaDevices.getUserMedia({ audio: { echoCancellation: true, noiseSuppression: false, autoGainControl: false } });
  analyser = actx.createAnalyser(); analyser.fftSize = 1024; analyser.smoothingTimeConstant = 0.3;
  actx.createMediaStreamSource(stream).connect(analyser);
  freqBuf = new Float32Array(analyser.frequencyBinCount);
  micOK = true;
}

let calibrating = false;
function updateBreath(dt) {
  let raw = 0;
  if (micOK && !(actx && actx.currentTime < voiceUntil && !calibrating)) {
    const db = micDb();
    raw = calibrating ? Math.min(1, Math.max(0, (db + 100) / 60))
      : Math.pow(Math.min(1, Math.max(0, (db - breath.floor - 2) / Math.max(3, (breath.peak - breath.floor) * 0.6))), 0.7);
  }
  if (DEBUG && keys[' ']) raw = 1;
  const tau = raw > breath.level ? 0.08 : 0.25;
  breath.level += (raw - breath.level) * (1 - Math.exp(-dt / tau));
}

// ---------- 移動：傾身＝水平漂移；吐氣＝肺變空而下沉 ----------
const state = { ref: new THREE.Vector3(), vel: new THREE.Vector3(), lungs: 0.62, pitch0: 0 };
const keys = {};
addEventListener('keydown', (e) => { keys[e.key.toLowerCase()] = true; if (e.key === ' ') e.preventDefault(); });
addEventListener('keyup', (e) => { keys[e.key.toLowerCase()] = false; });
const target = new THREE.Vector3(), lookDir = new THREE.Vector3();
const SINK_BASE = 0.025;                         // 不吐氣時的下沉速度（公尺／秒），非常輕微
const SINK_EXHALE = 1.5;                         // 吐氣最大聲時額外的下沉速度
// 頭的角度以「開始時自然平視的角度」為準，所以每個人戴頭盔的習慣不同也沒關係
const RISE_FROM = THREE.MathUtils.degToRad(3);   // 比平視稍微抬頭 3 度就開始上浮
const RISE_FULL = THREE.MathUtils.degToRad(15);  // 抬頭 15 度時上浮最快
const RISE_MAX = 1.5;                            // 最快上浮速度
const LOOK_SINK_FROM = THREE.MathUtils.degToRad(10);  // 往下看超過 10 度開始下沉
const LOOK_SINK_FULL = THREE.MathUtils.degToRad(35);  // 往下看 35 度時下沉最快
const LOOK_SINK_MAX = 1.3;                            // 往下看的最快下沉速度
const OCEAN_BOOST = 1.2;                              // 在海洋層時，上下移動再加快（最多 2.2 倍）
function updateMove(dt, t, ending) {
  const head = camera.position;
  if (renderer.xr.isPresenting) {
    if (t < 1.5) state.ref.copy(head);
    else { state.ref.x += (head.x - state.ref.x) * dt / 60; state.ref.z += (head.z - state.ref.z) * dt / 60; }
  }
  target.set(0, 0, 0);
  if (!ending) {
    let ox = head.x - state.ref.x, oz = head.z - state.ref.z;
    if (!renderer.xr.isPresenting) { // 除錯：WASD 模擬傾身
      const f = (keys.w ? 1 : 0) - (keys.s ? 1 : 0), r = (keys.d ? 1 : 0) - (keys.a ? 1 : 0), y = camera.rotation.y;
      ox = (-Math.sin(y) * f + Math.cos(y) * r) * 0.2; oz = (-Math.cos(y) * f - Math.sin(y) * r) * 0.2;
    }
    const m = Math.hypot(ox, oz), s = smooth(0.04, 0.14, m) * 1.4;   // 前傾 4 公分開始、14 公分最快
    if (m > 1e-4) { target.x = ox / m * s; target.z = oz / m * s; }
    // 上下：平常非常緩慢地下沉；吐氣或往下看會下沉；稍微抬頭就會浮起
    const ex = breath.level > 0.04 ? breath.level : 0;
    camera.getWorldDirection(lookDir);
    const pitchAbs = Math.asin(THREE.MathUtils.clamp(lookDir.y, -1, 1));
    if (renderer.xr.isPresenting && t < 2) state.pitch0 = THREE.MathUtils.clamp(pitchAbs, -0.26, 0.17);
    const pitch = pitchAbs - state.pitch0;
    const rise = smooth(RISE_FROM, RISE_FULL, pitch) * RISE_MAX;
    const sink = SINK_BASE + SINK_EXHALE * ex + smooth(LOOK_SINK_FROM, LOOK_SINK_FULL, -pitch) * LOOK_SINK_MAX;
    const boost = 1 + OCEAN_BOOST * zoneWeight('ocean', rig.position.y + head.y);
    target.y = (rise - sink) * boost;
  } else { ascend(dt, t); return; }
  // 水平慢慢加速；垂直反應快一點，吐氣時能立刻感覺到下沉
  const kh = 1 - Math.exp(-dt / 1.4), kv = 1 - Math.exp(-dt / 0.7);
  state.vel.x += (target.x - state.vel.x) * kh; state.vel.z += (target.z - state.vel.z) * kh;
  state.vel.y += (target.y - state.vel.y) * kv;
  rig.position.addScaledVector(state.vel, dt);
  const eyeY = rig.position.y + head.y;
  if (eyeY > EYE_MAX) { rig.position.y = EYE_MAX - head.y; state.vel.y = Math.min(0, state.vel.y); }
  if (eyeY < EYE_MIN) { rig.position.y = EYE_MIN - head.y; state.vel.y = Math.max(0, state.vel.y); }
  const r = Math.hypot(rig.position.x, rig.position.z);
  if (r > WORLD_R) { rig.position.x *= WORLD_R / r; rig.position.z *= WORLD_R / r; }
}

// 結尾：把體驗者從所在位置緩緩帶回最上層，途中經過每一層
// 結尾：以穩定、緩慢的速度把體驗者帶回最上層，途中經過每一層
const ASC_V = 1.8;        // 上升速度（公尺／秒）
const ASC_SIDE = 0.3;     // 往中央水晶樹靠近的水平速度
let asc = null;
function ascend(dt, t) {
  const head = camera.position;
  if (!asc) asc = { v: Math.max(0, state.vel.y), arrived: null };
  const remain = TOP_EYE - (rig.position.y + head.y);
  const vTarget = Math.max(0, Math.min(ASC_V, remain * 0.2));           // 接近頂端時慢慢減速
  asc.v += (vTarget - asc.v) * (1 - Math.exp(-dt / 3));                  // 約 3 秒的緩和加速
  rig.position.y += asc.v * dt;
  const dx = 3 - rig.position.x, dz = 4 - rig.position.z, d = Math.hypot(dx, dz);
  if (d > 0.05) { const k = Math.min(d, ASC_SIDE * dt) / d; rig.position.x += dx * k; rig.position.z += dz * k; }
  if (remain < 0.6 && asc.arrived === null) asc.arrived = t;
  state.vel.set(0, 0, 0);
}
// 依照現在的深度決定何時開始回程，確保在 5 分鐘左右抵達頂端
function shouldEnd(t) {
  if (t < 90) return false;
  const need = Math.max(0, TOP_EYE - (rig.position.y + camera.position.y)) / ASC_V + 14;
  return t >= TOTAL - 10 - need;
}

// ---------- 主迴圈 ----------
const clock = new THREE.Clock();
let gridFade = 1;
const spoken = { lean: false, move: false, ending: false, final: false };
let endAt = null;
let running = false, tStart = 0, finished = false, audioTick = 0, endingStarted = false, fadeStarted = false, endingAt = null;
const eye = new THREE.Vector3(), sky = new THREE.Color();
renderer.setAnimationLoop(() => {
  const dt = Math.min(clock.getDelta(), 0.25), now = clock.elapsedTime;
  U.uTime.value = now;
  updateBreath(dt);
  meterBar.style.width = (breath.level * 100).toFixed(1) + '%';

  if (running) {
    const t = now - tStart;
    // 時間到了會自動回程；如果體驗者自己浮到最上層，也直接進入結尾
    if (endingAt === null && (shouldEnd(t) || (t > 30 && rig.position.y + camera.position.y >= TOP_EYE - 1))) endingAt = t;
    const ending = endingAt !== null, arrived = asc && asc.arrived !== null ? asc.arrived : null;
    updateMove(dt, t, ending);
    // 淡入（0–4 秒）；抵達頂端後停留片刻再淡出
    const fadeAt = arrived !== null ? Math.max(arrived + 1, endingAt + 10.5) : null;   // 結尾語音（13）說完、抵達頂端後就開始淡出
    veilMat.opacity = ending ? (fadeAt !== null ? smooth(fadeAt, fadeAt + 3, t) : 0) : 1 - smooth(0, 4, t);
    if (ending && !endingStarted && actx) { endingStarted = true; endingCue(); }
    // VR 裡只用人聲，不顯示文字
    if (!spoken.lean && t > 4.5 && !ending) { spoken.lean = true; speak(10); }
    if (!spoken.move && t > 15.5 && !ending) { spoken.move = true; speak(micOK ? 11 : 12); }
    if (!spoken.ending && ending && t > endingAt + 1) { spoken.ending = true; speak(13); }
    if (fadeAt !== null && t > fadeAt && !fadeStarted) {
      fadeStarted = true;
      if (actx) master.gain.setTargetAtTime(0, actx.currentTime, 1.2);
      endAt = t + (VOICES[14] ? VOICES[14].duration : 6) + 0.6;          // 一邊淡出一邊說最後一句，說完就結束
      spoken.final = true; speak(14);
    }
    if (endAt !== null && t > endAt && !finished) finish();
  } else if (!DEBUG) {
    camera.rotation.y = now * 0.03; // 開始前的背景緩慢旋轉
    veilMat.opacity = 0;
  } else veilMat.opacity = 0;

  veil.visible = veilMat.opacity > 0.002;   // 平常完全不畫，避免眼前殘留任何東西
  // 環境：天色、霧、網格、聲音
  camera.getWorldPosition(eye);
  if (SHOW_FPS) updateFps(dt, eye.y);
  skyAt(eye.y, sky); scene.background.copy(sky); scene.fog.color.copy(sky);
  // 起點的座標網格：只在一開始出現，前 20 秒內或離開幾公尺後就溶解，之後不再出現
  const tRun = running ? clock.elapsedTime - tStart : 0;
  gridFade = Math.min(gridFade, (1 - smooth(6, 20, tRun)) * (1 - smooth(2, 8, eye.distanceTo(gc))));
  if (!running) gridFade = 1;
  gridMat.opacity = 0.3 * gridFade;
  for (const g of codeRings) { g.position.x = eye.x; g.position.z = eye.z; }  // 程式碼環永遠以體驗者為中心
  if (actx && running) updateSound(dt, now);
  renderer.render(scene, camera);
});

// ---------- 介面流程 ----------
const $ = (id) => document.getElementById(id);
const meterBar = document.querySelector('#meter > div');
const show = (id) => ['stepWelcome', 'stepIntro', 'stepCal', 'stepReady', 'stepEnd'].forEach(s => $(s).hidden = s !== id);
function sample(ms) {
  return new Promise(res => { const arr = [], t0 = performance.now();
    const id = setInterval(() => { arr.push(micDb()); if (performance.now() - t0 > ms) { clearInterval(id); res(arr.sort((a, b) => a - b)); } }, 30); });
}
const wait = (ms) => new Promise(r => setTimeout(r, ms));
// 校準：每一段量測都在語音播完之後才開始，人聲不會被算進去
async function calibrate() {
  show('stepCal'); $('btnRetry').hidden = true; calibrating = true;
  $('calMsg').textContent = '';
  await speak(4);
  await speak(5);
  await wait(500);
  $('calMsg').textContent = '安靜呼吸中⋯';
  const quiet = await sample(4000);
  $('calMsg').textContent = '';
  await speak(6);
  await wait(300);
  $('calMsg').textContent = '吐氣中⋯';
  const blow = await sample(6000);
  $('calMsg').textContent = '';
  calibrating = false;
  breath.floor = quiet[Math.floor(quiet.length * 0.9)];
  breath.peak = blow[Math.floor(blow.length * 0.7)];
  if (breath.peak - breath.floor < 6) { $('btnRetry').hidden = false; speak(8); return; }
  show('stepReady'); $('stepReady').prepend($('meter'));
  speak(7);
}
// 說明共三頁（語音 1、2、3）。每頁播完自動進下一頁；「跳過說明」會停止這一頁的語音，直接進下一頁
let introPage = 0, introGen = 0;
function showIntroPage(n) {
  introPage = n; const gen = ++introGen;
  $('pageNo').textContent = `說明 ${n} / 3`;
  $('btnSkip').hidden = false;
  $('introBtns').hidden = n < 3;            // 第 3 頁說「請按下按鈕」時，按鈕同時出現
  speak(n).then(() => { if (gen === introGen) nextIntro(); });
}
function nextIntro() {
  if (introPage < 3) showIntroPage(introPage + 1);
  else { $('btnSkip').hidden = true; $('pageNo').textContent = ''; }
}
$('btnStart').onclick = async () => {
  if (!actx) initAudio();
  await actx.resume();
  show('stepIntro');
  $('btnSkip').hidden = true;
  $('subtitle').textContent = '載入中⋯';
  await voicesReady;
  showIntroPage(1);
};
$('btnSkip').onclick = () => { introGen++; stopVoice(); nextIntro(); };
$('btnMic').onclick = async () => {
  stopVoice();
  try { await initMic(); }
  catch (e) { micOK = false; show('stepReady'); speak(9); return; }
  await calibrate();
};
$('btnRetry').onclick = () => { stopVoice(); calibrate(); };
$('btnNoMic').onclick = () => { stopVoice(); micOK = false; show('stepReady'); speak(9); };

if (navigator.xr) navigator.xr.isSessionSupported('immersive-vr').then(ok => {
  $('btnVR').disabled = !ok;
  if (!ok) $('xrMsg').textContent = '這個瀏覽器不支援 VR。請在 Quest 頭盔的瀏覽器裡開啟這個網址。';
}).catch(() => {});
else $('xrMsg').textContent = '這個瀏覽器不支援 WebXR。請在 Quest 頭盔的瀏覽器裡開啟（需要 https）。';

function begin() {
  $('panel').hidden = true; stopVoice();
  rig.position.copy(START); state.vel.set(0, 0, 0); state.lungs = 0.62;
  camera.rotation.set(0, 0, 0);
  running = true; tStart = clock.elapsedTime; updatePixelScale();
  if (actx) { actx.resume(); master.gain.cancelScheduledValues(actx.currentTime); master.gain.setTargetAtTime(0.45, actx.currentTime, 1.5); }
}
function finish() {
  finished = true; running = false;
  const s = renderer.xr.getSession(); if (s) s.end(); else showEnd();
}
function showEnd() {
  running = false; finished = true; veilMat.opacity = 0; updatePixelScale();
  if (choirTimer) { clearInterval(choirTimer); choirTimer = null; }
  if (actx) master.gain.setTargetAtTime(0, actx.currentTime, 0.3);
  $('panel').hidden = false; show('stepEnd');
  if (actx && !spoken.final) speak(14);
}
$('btnVR').onclick = async () => {
  stopVoice(); $('subtitle').textContent = '';
  try {
    const session = await navigator.xr.requestSession('immersive-vr', { optionalFeatures: ['local-floor'] });
    await renderer.xr.setSession(session);
    session.addEventListener('end', showEnd);
    begin();
  } catch (e) { $('xrMsg').textContent = '無法進入 VR：' + e.message; }
};

// 除錯預覽：網址加上 ?debug，在電腦上用 WASD、空白鍵、滑鼠拖曳測試
if (DEBUG) {
  $('btnPreview').hidden = false;
  $('btnPreview').onclick = begin;
  let drag = null;
  renderer.domElement.addEventListener('pointerdown', e => drag = [e.clientX, e.clientY]);
  addEventListener('pointerup', () => drag = null);
  addEventListener('pointermove', e => {
    if (!drag) return;
    camera.rotation.y -= (e.clientX - drag[0]) * 0.004;
    camera.rotation.x = THREE.MathUtils.clamp(camera.rotation.x - (e.clientY - drag[1]) * 0.004, -1.4, 1.4);
    drag = [e.clientX, e.clientY];
  });
  window.__osmose = { rig, state, breath, eye, scene, camera, keys, skip: (sec) => { tStart -= sec; }, codeRings, VOICES, voiceState: () => ({ until: voiceUntil, now: actx && actx.currentTime, spoken }) };
}
</script>
</body>
</html>
